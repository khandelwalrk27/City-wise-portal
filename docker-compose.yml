version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - DB_PATH=/app/database/citywise.sqlite
      - JWT_SECRET=citywise_jaipur_production_secret_key_2026
    volumes:
      - ./data:/app/data
      - backend-uploads:/app/uploads
      - backend-db:/app/database
    restart: always

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: always

volumes:
  backend-uploads:
  backend-db:
